name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1

      - name: Set up Python
        uses: actions/setup-python@v7.0.0
        with:
          python-version: "3.12"

      - name: Validate release
        run: |
          python -S schemas/validate_pack.py
          python -S -m unittest discover -s tests -p "test_*.py" -v
          python -S evals/run_evals.py --output /tmp/sepack-eval-results.json
          python -S sepack.py integrity

      - name: Build source archive and checksum
        shell: bash
        run: |
          set -euo pipefail
          NAME="universal-software-engineering-skill-pack-${GITHUB_REF_NAME}"
          mkdir -p dist "$NAME"
          rsync -a --exclude '.git' --exclude 'dist' ./ "$NAME/"
          zip -qr "dist/${NAME}.zip" "$NAME"
          sha256sum "dist/${NAME}.zip" > "dist/${NAME}.zip.sha256"
          rm -rf "$NAME"

      - name: Publish GitHub release
        uses: softprops/action-gh-release@v3.0.3
        with:
          generate_release_notes: true
          files: |
            dist/*.zip
            dist/*.sha256
