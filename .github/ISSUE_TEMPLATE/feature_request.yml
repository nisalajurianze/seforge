name: Feature request
description: Propose a new capability or improvement
title: "[Feature]: "
labels: [enhancement, triage]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What user or engineering problem should be solved?
    validations:
      required: true
  - type: textarea
    id: outcome
    attributes:
      label: Desired outcome
      description: Describe observable success without prescribing a specific technology.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed approach
      description: Include alternatives, compatibility, risk, and migration considerations.
  - type: textarea
    id: evidence
    attributes:
      label: Supporting evidence
      description: Standards, provider documentation, examples, or project scenarios.
  - type: checkboxes
    id: scope
    attributes:
      label: Scope check
      options:
        - label: This proposal is not a security vulnerability report.
          required: true
        - label: I searched existing issues and roadmap items.
          required: true
